spring.application.name=lftime-servidor
# El perfil activo se elige con SPRING_PROFILES_ACTIVE (desarrollo, produccion). Sin él, "desarrollo".
spring.profiles.default=desarrollo

# Hibernate nunca crea ni cambia el esquema: lo hace Flyway (db/migracion). Ver plan.md §1.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.locations=classpath:db/migracion

# No se escriben datos personales en los registros de diagnóstico (plan.md §4).
spring.jpa.show-sql=false

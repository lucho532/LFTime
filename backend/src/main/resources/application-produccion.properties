# Perfil de producción. Todo secreto llega por variables de entorno; ninguno se escribe aquí.
server.port=${PORT:8080}
spring.datasource.url=${LFTIME_BD_URL}
spring.datasource.username=${LFTIME_BD_USUARIO}
spring.datasource.password=${LFTIME_BD_CLAVE}
server.forward-headers-strategy=framework

# El contrato OpenAPI solo se publica fuera de producción.
springdoc.api-docs.enabled=false
